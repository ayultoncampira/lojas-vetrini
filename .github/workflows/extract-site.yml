name: Extract site ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p _extracted
          unzip -q "$ZIP" -d _extracted

          # If the ZIP contains a single top-level folder, use its contents.
          if [ "$(find _extracted -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find _extracted -mindepth 1 -maxdepth 1 -type d)" ]; then
            ROOT="$(find _extracted -mindepth 1 -maxdepth 1 -type d)"
          else
            ROOT="_extracted"
          fi

          # Keep repository metadata/workflow, replace the site files.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name _extracted -exec rm -rf {} +
          cp -a "$ROOT"/. .
          rm -rf _extracted
          rm -f -- "$ZIP"

      - name: Commit extracted project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract site project from ZIP"
          git push
